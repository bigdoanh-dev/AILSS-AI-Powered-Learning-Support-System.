                    {
                      "algorithm": "UUIDv5",
                      "namespace": "d2c62169-6dd9-5a04-b04d-39f739f7c51a",
                      "name": "{draftId}:2",
                    },
                  "stateOrdering":
                    [
                      "reserve-approval-command",
                      "verify-generated-v1-and-checksum",
                      "validate-reviewed-objective-v1",
                      "store-immutable-approved-v2",
                      "revalidate-current-target",
                      "import-or-recover-assessment-draft",
                      "persist-ai-assessment-linkage",
                      "lwt-ai-draft-to-approved",
                      "persist-original-public-response",
                    ],
                },
              "summary": "Submit a reviewed objective-v1 draft and approve it after Assessment DRAFT import",
              "description": "Reviewed-edit and approval are one command. Generated version 1 remains immutable; every successful initial approval creates immutable reviewed version 2. APPROVED is committed only after the Assessment DRAFT import and AI linkage are durably known. Emits no event.",
              "parameters":
                [
                  {
                    "name": "draftId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "If-Match",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "const": '"v1"' },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/AiDraftApprovalRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Historical or newly completed approval/import result",
