          "post":
            {
              "operationId": "AI-05",
              "x-contract-status": "CONTRACT_DEFINED_RUNTIME_NOT_IMPLEMENTED",
              "x-idempotency":
                {
                  "scope": "AI-05:{actorId}:{draftId}",
                  "fingerprint": ["actorId", "draftId", "generatedDraftVersion", "canonicalReviewedDraft"],
                  "same-key-same-fingerprint": "return-original-response",
                  "same-key-different-fingerprint": "409 IDEMPOTENCY_CONFLICT",
