{
  "openapi": "3.1.0",
  "info": { "title": "AILSS Public API", "version": "7.12C" },
  "paths":
    {
      "/api/v1/auth/register":
        {
          "post":
            {
              "operationId": "IDN-01",
              "summary": "Đăng ký tài khoản",
              "parameters":
                [
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/RegistrationRequest" } },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Account created or original idempotent outcome replayed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/RegistrationResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [],
            },
        },
      "/api/v1/auth/login":
        {
          "post":
            {
              "operationId": "IDN-02",
              "summary": "Đăng nhập",
              "requestBody":
                {
                  "required": true,
                  "content":
                    { "application/json": { "schema": { "$ref": "#/components/schemas/LoginRequest" } } },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Initial access and refresh credentials issued for a persisted session",
                      "content":
                        {
                          "application/json": { "schema": { "$ref": "#/components/schemas/LoginResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "413": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [],
            },
        },
      "/api/v1/auth/refresh":
        {
          "post":
            {
              "operationId": "IDN-03",
              "summary": "Đổi access token",
              "requestBody":
                {
                  "required": true,
                  "content":
                    { "application/json": { "schema": { "$ref": "#/components/schemas/RefreshRequest" } } },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Current refresh credential atomically rotated",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/RefreshResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "413": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [],
            },
        },
      "/api/v1/auth/logout":
        {
          "post":
            {
              "operationId": "IDN-04",
              "summary": "Thu hồi phiên hiện tại",
              "description": "Revokes only the canonical session identified by the verified Bearer access token. The request has no body.",
              "responses":
                {
                  "200":
                    {
                      "description": "Current session is revoked or was already terminal",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "type": "object",
                                  "additionalProperties": false,
                                  "required": ["data", "meta"],
                                  "properties":
                                    {
                                      "data":
                                        {
                                          "type": "object",
                                          "additionalProperties": false,
                                          "required": ["loggedOut"],
                                          "properties": { "loggedOut": { "const": true } },
                                        },
                                      "meta": { "$ref": "#/components/schemas/ResponseMeta" },
                                    },
                                },
                            },
                        },
                    },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "413": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/me":
        {
          "get":
            {
              "operationId": "IDN-05",
              "summary": "Hồ sơ của tôi",
              "description": "Returns the canonical current-user profile only after session-aware owner authorization.",
              "responses":
                {
                  "200":
                    {
                      "description": "Canonical current-user profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ProfileResponse" } },
                        },
                    },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
          "patch":
            {
              "operationId": "IDN-06",
              "summary": "Cập nhật hồ sơ",
              "description": "Updates only the current user's display name. Profile-version concurrency is server-side because no client If-Match binding exists in the locked contract.",
              "parameters":
                [
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/ProfileUpdateRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Profile updated, no-op completed, or original idempotent outcome replayed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/ProfileUpdateResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "413": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/me/password":
        {
          "post":
            {
              "operationId": "IDN-07",
              "summary": "Đổi mật khẩu",
              "description": "Changes the authenticated user's password after operation-bound current-password reauthentication. Success invalidates prior access and refresh authorization and returns no replacement credentials.",
              "parameters":
                [
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/PasswordChangeRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Password changed or the original logical outcome replayed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/PasswordChangeResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "413": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "500": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/lecturers/{lecturerId}":
        {
          "get":
            {
              "operationId": "IDN-08",
              "summary": "Hồ sơ giảng viên công khai",
              "description": "Anonymous access is allowed. If Authorization is present it must be one strict, valid Bearer access token; invalid credentials are never downgraded to anonymous.",
              "parameters":
                [
                  {
                    "name": "lecturerId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Active verified lecturer public profile",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/PublicLecturerProfileResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{}, { "bearerAuth": [] }],
            },
        },
      "/api/v1/admin/users":
        {
          "get":
            {
              "operationId": "IDN-09",
              "summary": "Tra cứu người dùng",
              "description": "Canonical ADMIN authorization. Exact required role/status filters route a bounded 16-shard Q-IDN-005 merge; cursor is opaque and integrity protected.",
              "parameters":
                [
                  {
                    "name": "role",
                    "in": "query",
                    "required": true,
                    "schema": { "$ref": "#/components/schemas/AdminRole" },
                  },
                  {
                    "name": "status",
                    "in": "query",
                    "required": true,
                    "schema": { "$ref": "#/components/schemas/AccountStatus" },
                  },
                  {
                    "name": "limit",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 50 },
                  },
                  {
                    "name": "cursor",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "string", "minLength": 16, "maxLength": 16384 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Bounded role/status search page",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminUserSearchResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/admin/users/{userId}":
        {
          "get":
            {
              "operationId": "IDN-10",
              "summary": "Chi tiết người dùng",
              "parameters":
                [
                  {
                    "name": "userId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Privacy-minimal Admin operational user detail",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminUserDetailResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/admin/users/{userId}/status":
        {
          "patch":
            {
              "operationId": "IDN-11",
              "summary": "Đổi trạng thái người dùng",
              "description": "Bearer plus canonical ADMIN/session authorization and operation-bound current-password step-up. This is reauthentication, not MFA.",
              "parameters":
                [
                  {
                    "name": "userId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/AdminStatusChangeRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Recoverable account status transition completed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/AdminStatusChangeResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/admin/lecturers/{userId}/verify":
        {
          "post":
            {
              "operationId": "IDN-12",
              "summary": "Xác minh giảng viên",
              "description": "Bearer plus canonical ADMIN/session authorization and operation-bound current-password step-up. This is privilege-elevating reauthentication, not MFA. Advances the target security epoch once and converges the Q-IDN-006 public and Q-IDN-005 admin-search projections.",
              "parameters":
                [
                  {
                    "name": "userId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        { "schema": { "$ref": "#/components/schemas/LecturerVerifyRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "Recoverable lecturer verification completed",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/LecturerVerifyResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/courses":
        {
          "get":
            {
              "operationId": "LRN-01",
              "summary": "Danh mục khóa học",
              "description": "Public published-course catalog for an exact category. Optional Bearer; invalid bearer is rejected, never downgraded. Served from Q-LRN-003 with a Q-LRN-001 canonical published-visibility guard.",
              "parameters":
                [
                  {
                    "name": "categoryId",
                    "in": "query",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "limit",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
                  },
                  {
                    "name": "cursor",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "string", "minLength": 16, "maxLength": 16384 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Published course catalog page",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/CourseCatalogResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{}, { "bearerAuth": [] }],
            },
          "post":
            {
              "operationId": "LRN-05",
              "summary": "Tạo khóa học",
              "description": "Create a private DRAFT course. Requires a canonically eligible Lecturer and an Idempotency-Key. Draft slug is normalized but not globally reserved until publish.",
              "parameters":
                [
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json": { "schema": { "$ref": "#/components/schemas/CourseWriteRequest" } },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Private DRAFT course created",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/CourseAuthoringResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/courses/search":
        {
          "get":
            {
              "operationId": "LRN-02",
              "summary": "Tìm kiếm khóa học",
              "description": "Limited normalized prefix/token search over published courses. Not full-text, fuzzy, or LIKE. Served from Q-LRN-004 with a Q-LRN-001 canonical published-visibility guard and canonical search-predicate revalidation.",
              "parameters":
                [
                  {
                    "name": "q",
                    "in": "query",
                    "required": true,
                    "schema": { "type": "string", "minLength": 3, "maxLength": 20 },
                  },
                  {
                    "name": "limit",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 20 },
                  },
                  {
                    "name": "cursor",
                    "in": "query",
                    "required": false,
                    "schema": { "type": "string", "minLength": 16, "maxLength": 16384 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Published course search page",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/CourseCatalogResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{}, { "bearerAuth": [] }],
            },
        },
      "/api/v1/courses/{courseId}":
        {
          "get":
            {
              "operationId": "LRN-03",
              "summary": "Chi tiết khóa học",
              "description": "Public detail of a published course from the Q-LRN-001 canonical read. Missing or non-PUBLISHED courses return a safe 404; internal state is never revealed.",
              "parameters":
                [
                  {
                    "name": "courseId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Published course detail",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/CourseDetailResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{}, { "bearerAuth": [] }],
            },
          "patch":
            {
              "operationId": "LRN-06",
              "summary": "Cập nhật khóa học",
              "description": "Owner-only metadata PATCH for a private DRAFT course. Empty, unknown, protected and state-transition fields are rejected.",
              "parameters":
                [
                  {
                    "name": "courseId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                  },
                  {
                    "name": "Idempotency-Key",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json": { "schema": { "$ref": "#/components/schemas/CoursePatchRequest" } },
                    },
                },
              "responses":
                {
                  "200":
                    {
                      "description": "DRAFT metadata updated or semantic no-op",
                      "content":
                        {
                          "application/json":
                            { "schema": { "$ref": "#/components/schemas/CourseAuthoringResponse" } },
                        },
                    },
                  "400": { "$ref": "#/components/responses/ErrorResponse" },
                  "401": { "$ref": "#/components/responses/ErrorResponse" },
                  "403": { "$ref": "#/components/responses/ErrorResponse" },
                  "404": { "$ref": "#/components/responses/ErrorResponse" },
                  "409": { "$ref": "#/components/responses/ErrorResponse" },
                  "422": { "$ref": "#/components/responses/ErrorResponse" },
                  "429": { "$ref": "#/components/responses/ErrorResponse" },
                  "503": { "$ref": "#/components/responses/ErrorResponse" },
                },
              "security": [{ "bearerAuth": [] }],
            },
        },
      "/api/v1/courses/by-slug/{slug}":
        {
          "get":
