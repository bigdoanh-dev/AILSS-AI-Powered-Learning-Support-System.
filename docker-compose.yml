networks:
  ai_egress: { name: ailss_ai_egress }
  edge_net: { name: ailss_edge_net }
  # Loopback-published management/API ports need one non-internal network on
  # Docker Desktop. Application traffic still uses the isolated data_net.
  ops_net: { name: ailss_ops_net }
  service_net: { name: ailss_service_net, internal: true }
  data_net: { name: ailss_data_net, internal: true }

volumes:
  cassandra_dev_data: {}
  cassandra_node1_data: {}
  cassandra_node2_data: {}
  cassandra_node3_data: {}
  cassandra_audit1: {}
  cassandra_audit2: {}
  cassandra_audit3: {}
  rabbitmq_data: {}
  minio_data: {}

configs:
  cassandra_configurator:
    file: ./infrastructure/cassandra/configure-cassandra.py
  cassandra_entrypoint:
    file: ./infrastructure/cassandra/configure-cassandra.sh
